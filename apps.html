<html lang="pt-BR">
<head>

<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#182338;--line:#25324b;--tx:#e8eef8;--mut:#8fa1bd;--acc:#ff7a1a;--acc2:#38bdf8;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
header .logo{font-size:22px}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt small{color:var(--mut);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:5px}
.dot.on{background:var(--ok)}
.hbtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}
.hbtn.on{border-color:var(--acc);color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,18,32,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--acc);background:rgba(255,122,26,.1)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3 small{font-weight:400;color:var(--mut);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.dis{opacity:.35;pointer-events:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;border-left:4px solid var(--line)}
.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}
.kpi .l{font-size:11.5px;color:var(--mut);margin-bottom:4px;min-height:28px}
.kpi .v{font-size:22px;font-weight:700;line-height:1.1}
.kpi .m{font-size:11.5px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.kpi .d.ok{color:var(--ok)}.kpi .d.bad{color:var(--bad)}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.kpi.bad .bar i{background:var(--bad)}
.kpi.nm .bar i{background:var(--acc2)}
.score{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.score .n{font-size:26px;font-weight:800}
.score .t{flex:1;font-size:12.5px;color:var(--mut)}
.score .t b{color:var(--tx);display:block;font-size:14px}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;background:var(--line);color:var(--mut)}
.badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}.badge.bad{background:rgba(239,68,68,.15);color:var(--bad)}
.badge.warn{background:rgba(245,158,11,.15);color:var(--warn)}.badge.acc{background:rgba(255,122,26,.15);color:var(--acc)}.badge.blue{background:rgba(56,189,248,.15);color:var(--acc2)}
.cv{position:relative;height:230px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:11.5px}
td:first-child,th:first-child{text-align:left}
td.ok{color:var(--ok)}td.bad{color:var(--bad)}td.nd{color:var(--line)}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.rk .p{width:30px;text-align:center;font-size:20px;font-weight:700;color:var(--mut)}
.rk .i{flex:1;min-width:0}
.rk .i b{font-size:14px}
.rk .i .b{height:6px;border-radius:6px;background:var(--line);margin-top:5px;overflow:hidden;display:flex}
.rk .i .b i{display:block;height:100%}
.rk .c{text-align:right;font-size:11.5px;color:var(--mut);white-space:nowrap}
.rk .c b{display:block;font-size:20px;color:var(--tx)}
.dss{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.dss:last-child{border-bottom:0}
.dss .dt{width:54px;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 0;flex:0 0 auto}
.dss .dt b{display:block;font-size:18px}.dss .dt small{color:var(--mut);font-size:10.5px;text-transform:uppercase}
.dss .dt.hj{border-color:var(--acc);background:rgba(255,122,26,.12)}
.dss .tx{flex:1;min-width:0}.dss .tx .tm{font-weight:600}.dss .tx .rs{font-size:12.5px;color:var(--mut)}
.dss .emp{color:var(--mut);font-size:13px;padding-top:9px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px;font-size:12.5px;color:var(--mut)}
.item .top b{color:var(--tx)}
.item p{margin:4px 0 0;font-size:13.5px;line-height:1.4}
.item .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.conq{border-left:4px solid var(--acc)}
.conq .mes{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pess{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pess span{background:rgba(56,189,248,.13);color:var(--acc2);border-radius:14px;padding:3px 10px;font-size:12.5px}
.eq{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.eq{grid-template-columns:repeat(2,1fr)}}
.eqc .nm{font-size:16px;font-weight:700}
.eqc .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:13px}
.eqc .kv span{color:var(--mut)}
.btn{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.red{background:rgba(239,68,68,.18);color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters input{grid-column:1/-1}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.mback{align-items:center}}
.mbox{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0}
@media(min-width:720px){.mbox{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh .x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.mb{padding:4px 16px 12px;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:6px 11px;margin:0;color:var(--tx);font-size:13px}
.chk input{width:auto;margin:0}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.mut{color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13.5px}
details summary{cursor:pointer;color:var(--acc2);font-size:13.5px;padding:4px 0}
.note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--warn);border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}

/* ===== MODO TV (1920x1080) ===== */
.tvinfo{display:none;font-size:15px;font-weight:700;white-space:nowrap}
.tvinfo small{color:var(--mut);font-weight:500;margin-left:10px}
body.tv{zoom:var(--tvz,1.5);padding-bottom:0;cursor:none;user-select:none}
body.tv nav,body.tv .toolbar,body.tv .filters,body.tv details{display:none!important}
body.tv .tvinfo{display:block}
body.tv header{padding-top:8px;padding-bottom:8px}
body.tv header .tt small{display:none}
body.tv main{max-width:none;padding:12px 14px 18px;column-count:2;column-gap:14px}
body.tv main>.sec,body.tv main>.score{break-inside:avoid;-webkit-column-break-inside:avoid}
body.tv main>.seg,body.tv main>.note{column-span:all}
body.tv .grid,body.tv .grid.g3{grid-template-columns:repeat(3,1fr)}
body.tv .eq{grid-template-columns:1fr}
body.tv .cv{height:250px}
body.tv .chips{flex-wrap:wrap;overflow:visible}
body.tv .sec{margin-bottom:12px}
</style>

<script>
/* ===== PARSERS DAS PLANILHAS (mesma lógica para dados padrão e importação) ===== */
var MESES_ABR = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

var EQUIPE_SEG = {
  'ALESSANDRO LUIZ GONZAGA': 'Alessandro',
  'BRUNO JOSE LELIS CARVALHO': 'Bruno',
  'DIENIFER LIARA SILVA DA LUZ': 'Dienifer',
  'EDILON GONCALVES GLICERIO': 'Edilon',
  'ELCIO DA SILVA RODRIGUES': 'Elcio',
  'JOSE GERALDO MARTINS': 'José Geraldo',
  'LUIZ HENRIQUE NEVES DE OLIVEIRA': 'Luiz Henrique',
  'SAMUELL MAIKONN ARAUJO BRANDAO': 'Samuell'
};

function pz(n) { return (n < 10 ? '0' : '') + n; }
function normTxt(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}
var _d1904 = false;
function isoDe(n, sis1904) {
  var dt = new Date(Math.round((n - (sis1904 ? 24107 : 25569)) * 86400000));
  return dt.getUTCFullYear() + '-' + pz(dt.getUTCMonth() + 1) + '-' + pz(dt.getUTCDate());
}
/* escolhe o sistema de datas (1900/1904) plausível para cada célula */
function serialToIso(n) {
  var lim = new Date().getFullYear() + 1, a = isoDe(n, _d1904), ya = +a.slice(0, 4);
  if (ya >= 2023 && ya <= lim) return a;
  var b = isoDe(n, !_d1904), yb = +b.slice(0, 4);
  if (yb >= 2023 && yb <= lim) return b;
  return a;
}
function isSerialDate(v) { return typeof v === 'number' && v > 30000 && v < 70000; }
function setSistemaData(wb) { _d1904 = !!(wb && wb.Workbook && wb.Workbook.WBProps && wb.Workbook.WBProps.date1904); }
function hhmm(f) {
  if (typeof f !== 'number') return '';
  var m = Math.round((f % 1) * 1440);
  return pz(Math.floor(m / 60) % 24) + ':' + pz(m % 60);
}
function hrs(v) { return typeof v === 'number' && isFinite(v) ? Math.round(v * 24 * 100) / 100 : null; }
function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function pct(v) { return typeof v === 'number' && isFinite(v) ? Math.round(v * 10000) / 100 : null; }
function pctMeta(v) { return typeof v === 'number' && isFinite(v) ? Math.round((v <= 1.5 ? v * 100 : v) * 100) / 100 : null; }

function getRows(XLSX, wb, name) {
  var alvo = normTxt(name), real = null;
  for (var i = 0; i < wb.SheetNames.length; i++) {
    if (normTxt(wb.SheetNames[i]) === alvo) { real = wb.SheetNames[i]; break; }
  }
  if (!real) return null;
  return XLSX.utils.sheet_to_json(wb.Sheets[real], { header: 1, raw: true, defval: null });
}

/* corrige o ano de um único mês "antigo" (ex.: janeiro rotulado com ano anterior) */
function corrigirAno(itens) {
  if (!itens.length) return itens;
  var maxY = 0, i;
  for (i = 0; i < itens.length; i++) { var y = +itens[i].d.slice(0, 4); if (y > maxY) maxY = y; }
  var primeiroMax = null;
  for (i = 0; i < itens.length; i++) { if (+itens[i].d.slice(0, 4) === maxY) { primeiroMax = +itens[i].d.slice(5, 7); break; } }
  var antigos = {}, nAnt = 0;
  for (i = 0; i < itens.length; i++) {
    if (+itens[i].d.slice(0, 4) < maxY) { antigos[itens[i].d.slice(0, 7)] = 1; }
  }
  var chaves = Object.keys(antigos); nAnt = chaves.length;
  if (nAnt === 1 && +chaves[0].slice(5, 7) < primeiroMax) {
    for (i = 0; i < itens.length; i++) {
      if (+itens[i].d.slice(0, 4) < maxY) itens[i].d = maxY + itens[i].d.slice(4);
    }
  }
  return itens;
}

/* ---------- KPI BENEFICIAMENTO ---------- */
function parseKPI(R) {
  var blocos = [], i;
  for (i = 0; i < R.length; i++) { if (R[i] && String(R[i][0]).trim().toUpperCase() === 'JAN') blocos.push(i); }
  if (blocos.length < 2) throw new Error('Aba KPI BENEFICIAMENTO fora do padrão');
  var ic = [], ib = [], k, r, hOp;
  for (k = 0; k < 13; k++) {
    r = R[blocos[0] + k] || [];
    hOp = hrs(r[2]);
    var tem = hOp > 0;
    ic.push({
      mes: k < 12 ? MESES_ABR[k] : 'ANO', tem: tem,
      hCal: hrs(r[1]), hOp: hOp, hParOp: hrs(r[3]), hParMan: hrs(r[4]), hDuas: hrs(r[5]),
      disp: { m: pctMeta(r[6]), r: tem ? pct(r[7]) : null },
      util: { m: pctMeta(r[8]), r: tem ? pct(r[9]) : null },
      rend: { m: pctMeta(r[10]), r: tem ? pct(r[11]) : null },
      oee: { m: pctMeta(r[17]), r: tem ? pct(r[18]) : null },
      oeeCic: { m: pctMeta(r[19]), r: tem ? pct(r[20]) : null },
      tph: { m: num(r[14]), r: tem ? num(r[15]) : null },
      hm3: { o: num(r[21]), r: tem ? num(r[24]) : null },
      cic: { o: num(r[22]), r: tem ? num(r[25]) : null },
      prod: { o: num(r[23]), r: tem ? num(r[26]) : null },
      alim: tem ? num(r[29]) : null,
      rec: { m: pctMeta(r[32]), r: tem ? pct(r[30]) : null },
      recMag: { m: pctMeta(r[32]), r: tem ? pct(r[31]) : null }
    });
    r = R[blocos[1] + k] || [];
    hOp = hrs(r[2]);
    tem = hOp > 0;
    ib.push({
      mes: k < 12 ? MESES_ABR[k] : 'ANO', tem: tem,
      hCal: hrs(r[1]), hOp: hOp, hParTot: hrs(r[3]), hParOp: hrs(r[4]), hParMan: hrs(r[5]),
      disp: { m: pctMeta(r[6]), r: tem ? pct(r[7]) : null },
      util: { m: pctMeta(r[8]), r: tem ? pct(r[9]) : null },
      rend: { m: pctMeta(r[10]), r: tem ? pct(r[11]) : null },
      tph: { m: num(r[12]), r: tem ? num(r[13]) : null },
      oee: { m: pctMeta(r[14]), r: tem ? pct(r[15]) : null },
      hm1: tem ? num(r[16]) : null,
      heSil: tem ? num(r[18]) : null,
      itab: tem ? num(r[19]) : null,
      prod: { o: num(r[22]), r: tem ? num(r[23]) : null }
    });
  }
  return { icman: ic, ibman: ib };
}

/* ---------- RELATÓRIOS DIÁRIOS ---------- */
function parseDiario(R, tipo) {
  var out = [];
  for (var i = 0; i < R.length; i++) {
    var r = R[i];
    if (!r || !isSerialDate(r[0])) continue;
    if (tipo === 'icman') {
      if (!(r[8] > 0)) continue;
      out.push({ d: serialToIso(r[0]), prod: num(r[15]), hm3: num(r[13]), cic: num(r[14]), tph: num(r[16]),
        idf: pct(r[17]), uf: pct(r[18]), ro: pct(r[19]), oee: pct(r[20]), aut: hrs(r[4]) });
    } else {
      if (!(r[8] > 0)) continue;
      out.push({ d: serialToIso(r[0]), prod: num(r[9]), hm3: num(r[10]), cic: num(r[11]), tph: num(r[12]),
        idf: pct(r[13]), uf: pct(r[14]), ro: pct(r[15]), oee: pct(r[16]), aut: hrs(r[3]) });
    }
  }
  return corrigirAno(out);
}

/* ---------- FALHAS AUT (todas as abas) ---------- */
function ehAUT(v) { return typeof v === 'string' && /^\s*AUT\b/i.test(v); }

function parseFalhas(XLSX, wb) {
  var falhas = [], vistos = {}, porTempo = {}, cobertura = null;
  function add(f, principal) {
    var t = f.d + '|' + f.ini + '|' + f.fim;
    if (!principal && porTempo[t]) return;
    var k = t + '|' + f.tag + '|' + f.obs;
    if (vistos[k]) return;
    vistos[k] = 1;
    if (principal) porTempo[t] = 1;
    f.id = f.d.replace(/-/g, '') + f.ini.replace(':', '') + '_' + String(f.tag || 'X').replace(/[^A-Za-z0-9]/g, '');
    falhas.push(f);
  }

/* ---------- ANOMALIAS (relatos e recusas da equipe) ---------- */
function parseDataAnom(v) {

    var m = v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return m[3] + '-' + pz(+m[1]) + '-' + pz(+m[2]);
  }

}

function ehRecusa(desc, sub) {
  var t = normTxt(desc);
  if (/RECUS/.test(t)) return true;
  if (/^05/.test(String(sub).trim()) && /NAO FOI EXECUTAD|IMPOSSIBILIT|NAO (REALIZ|EXECUT)/.test(t)) return true;
  return false;
}

function parseAnomalia(XLSX, wb) {

  var cId = col('Número do Registro'), cD = col('Data do evento'), cDesc = col('Descrição do evento'),
      cSub = col('ID do Subtipo da Origem da Anomalia'), cSt = col('Status da Anomalia'), cNome = col('Nome completo que registrou');
  if (cD < 0 || cNome < 0) throw new Error('Colunas esperadas não encontradas');
  var regs = [], total = 0;
  for (i = h + 1; i < R.length; i++) {
    var r = R[i];
    if (!r || r[cId] == null) continue;
    total++;
    var chave = normTxt(r[cNome]);
    if (!EQUIPE_SEG[chave]) continue;
    var d = parseDataAnom(r[cD]);
    if (!d) continue;
    var desc = String(r[cDesc] || '').trim();
    var sub = String(r[cSub] || '').trim();
    regs.push({
      id: String(r[cId]).replace(/^0+/, ''), d: d, nome: EQUIPE_SEG[chave],
      sub: sub.replace(/\s*\(\d+\)\s*$/, '').replace(/^\d+\s*-\s*/, '') || 'Não informado',
      desc: desc.length > 420 ? desc.slice(0, 420) + '…' : desc,
      status: String(r[cSt] || '').trim(),
      tipo: ehRecusa(desc, sub) ? 'recusa' : 'relato'

  }
  regs.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  return { registros: regs, totalGeral: total };
}

function parseFalhasAno(XLSX, wb) {

  if (/SENSOR|TRANSMISSOR|NIVEL|PRESSAO|SONDA|MEDIDOR|CELULA DE CARGA|BALANCA|VAZAO|TEMPERATURA|ULTRASS|DETECTOR|INDICADOR|ANALISADOR|DENSIM|\bPIT\b|\bLIT\b|\bFIT\b/.test(t)) return 'Instrumentação';
  return 'Automação';
}

var AUTO = { on: false, seg: 15 }, _autoT = null, _autoI = 0, _wake = null;
var PASSOS = [['ind', 'ibman'], ['ind', 'icman'], ['seg'], ['cor'], ['con'], ['eq']];

}

}

}

    if (on && navigator.wakeLock && !_wake) navigator.wakeLock.request('screen').then(function (l) { _wake = l; l.addEventListener('release', function () { _wake = null; }); }).catch(function () {});
    if (!on && _wake) { _wake.release(); _wake = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && AUTO.on) telaLigada(true); });
function irPasso(i) {

function tvRolar() {
  cancelAnimationFrame(_rafScroll);
  if (!TV.on) return;
  window.scrollTo(0, 0);
  setTimeout(function () {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max < 10) return;
    var dur = Math.max(3000, AUTO.seg * 1000 * 0.8), espera = 1500, ini = null;
    function f(ts) {
      if (ini == null) ini = ts;
      var t = ts - ini - espera;
      if (t > 0) window.scrollTo(0, max * Math.min(1, t / (dur - espera)));
      if (t < dur) _rafScroll = requestAnimationFrame(f);
    }
    _rafScroll = requestAnimationFrame(f);
  }, 900);
}
function alternarTV(forcar) {
  var novo = typeof forcar === 'boolean' ? forcar : !TV.on;
  TV.on = novo;
  try { localStorage.setItem('ind_tv', novo ? '1' : '0'); } catch (e) {}
  aplicarTV();
  if (novo) {
    if (!AUTO.on) { AUTO.on = true; if (AUTO.seg < 10) AUTO.seg = 20; try { localStorage.setItem('ind_auto', JSON.stringify(AUTO)); } catch (e) {} }
    try { var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } catch (e) {}
  } else {
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }
  autoSync(); autoAplicar(); renderTab();
}
function aplicarTV() {
  document.body.classList.toggle('tv', TV.on);
  var b = document.getElementById('btnTV');
  b.className = 'hbtn' + (TV.on ? ' on' : '');
  if (TV.on) { tvZoom(); clearInterval(_clock); _clock = setInterval(tvTitulo, 20000); }
  else { clearInterval(_clock); document.documentElement.style.removeProperty('--tvz'); cancelAnimationFrame(_rafScroll); }
}
function tvCarregar() {
  var q = /[?&]tv=(\d)/.exec(location.search);
  try {
    if (q) localStorage.setItem('ind_tv', q[1]);
    TV.on = localStorage.getItem('ind_tv') === '1';
  } catch (e) { TV.on = !!(q && q[1] === '1'); }
  if (TV.on && !AUTO.on) { AUTO.on = true; if (AUTO.seg < 10) AUTO.seg = 20; }
}
document.addEventListener('keydown', function (e) {
  if (!TV.on || (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    irPasso((autoIndice() + (e.key === 'ArrowRight' ? 1 : PASSOS.length - 1)) % PASSOS.length);
    autoSync();
  } else if (e.key === 'Escape') { alternarTV(false); }
});

/* ================= INICIALIZAÇÃO ================= */
function iniciarApp(user) {
  fbUser = user;
  admin = ADMIN_EMAILS.indexOf(String(user.email || '').toLowerCase()) >= 0 ? { displayName: user.email } : null;
  aplicarAuth(); atualizarSub(); renderNav(); renderTab();
  iniciarSync();
}
carregarLocal(); autoCarregar(); tvCarregar();
atualizarSub(); setSync(false); renderNav(); aplicarTV(); autoAplicar();
(function () {
  if (!configOk() || typeof firebase === 'undefined') { location.replace('index.html'); return; }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(function (u) {
    if (!u) { location.replace('index.html'); return; }
    iniciarApp(u);
  });
})();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js?v=2').catch(function (e) { console.warn('SW:', e); }); }
