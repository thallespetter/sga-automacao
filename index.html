<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nova Gestão | Automação</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ECEEEB; --surface:#FFFFFF; --surface2:#F3F5F2; --ink:#14202B; --muted:#586472; --line:#D5DAD4;
  --ib:#2A6F97; --ic:#A65A22;
  --ok:#1E8A5A; --warn:#B0810A; --bad:#C23B3B;
  --okbg:#DDF1E5; --warnbg:#F6EBC8; --badbg:#F8DEDE;
  --hi:#F2C200; --focus:#1A66D6;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --num:'Barlow Semi Condensed','Barlow','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11161B; --surface:#192028; --surface2:#212A33; --ink:#E8EDF1; --muted:#9AA6B2; --line:#2B3640;
    --ib:#5DAAD7; --ic:#E29A5E;
    --ok:#4CC38A; --warn:#E2B73F; --bad:#F27575;
    --okbg:#173A2B; --warnbg:#3D3413; --badbg:#48211F;
    --hi:#F2C200; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11161B; --surface:#192028; --surface2:#212A33; --ink:#E8EDF1; --muted:#9AA6B2; --line:#2B3640;
  --ib:#5DAAD7; --ic:#E29A5E;
  --ok:#4CC38A; --warn:#E2B73F; --bad:#F27575;
  --okbg:#173A2B; --warnbg:#3D3413; --badbg:#48211F;
  --hi:#F2C200; --focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
button,input,select,textarea{scroll-margin-bottom:170px}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 0}
.top h1{font:600 21px/1.1 var(--num);letter-spacing:.1px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .grow{flex:1;min-width:0}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 9px,#14202B 9px 18px)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;font-size:14px}
.iconbtn svg{width:18px;height:18px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--hi);color:#14202B;font-weight:600;font-size:12px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:500;min-height:56px;border-top:3px solid transparent}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink);font-weight:600}
main{padding:6px 0 150px}
@media (min-width:820px){
  .nav{position:static;background:transparent;border-top:0;border-bottom:1px solid var(--line);padding:0;max-width:1040px;margin:0 auto}
  .nav button{flex:none;flex-direction:row;gap:8px;padding:0 16px;font-size:14px;min-height:46px;border-top:0;border-bottom:3px solid transparent}
  .nav button[aria-selected="true"]{border-bottom-color:var(--ink)}
  main{padding-bottom:60px}
}

/* cartões e textos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.card h2{font:600 19px/1.2 var(--num);margin-bottom:2px}
.card h3{font:600 15px/1.25 var(--font);margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}

/* chips e controles */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:thin}
.chip{flex:none;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[disabled]{opacity:.4;cursor:default}
.plants{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.plant{text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left:6px solid var(--pc)}
.plant[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.plant .pn{font:700 22px/1 var(--num)}
.plant .ps{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.plant .ps b{color:var(--ink);font-family:var(--num);font-size:15px}
.plant .pips{margin:8px 0 2px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:13px;height:13px;border-radius:3px;background:var(--line)}
.pip.ok{background:var(--ok)}.pip.warn{background:var(--warn)}.pip.bad{background:var(--bad)}
select,input[type=text],input[type=date],input[type=month],input[type=password],input[type=number],textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;margin:0 0 10px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.admin{margin-top:14px;padding:12px;border:1px solid var(--line);border-left:6px solid var(--hi);border-radius:8px;background:var(--surface2)}
.admin h3{margin-top:0}

/* indicadores: barra de meta */
.kpi{padding:10px 0;border-top:1px solid var(--line)}
.kpi:first-of-type{border-top:0}
.kpi-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kpi-n{font-weight:500}
.kpi-v{font:700 24px/1 var(--num);white-space:nowrap}
.bullet{position:relative;height:10px;margin:8px 0 6px;background:var(--surface2);border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
.bullet .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ok)}
.bullet .tick{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink)}
.s-ok .fill{background:var(--ok)}.s-warn .fill{background:var(--warn)}.s-bad .fill{background:var(--bad)}.s-na .fill{background:var(--line)}
.kpi-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.kpi-f .d{font-weight:600}
.s-ok .d{color:var(--ok)}.s-warn .d{color:var(--warn)}.s-bad .d{color:var(--bad)}
.kpi-x{font-size:12.5px;color:var(--muted);margin-top:2px}
.score{display:flex;align-items:center;gap:12px;margin:8px 0 6px;flex-wrap:wrap}
.score b{font:700 28px/1 var(--num)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat{padding:8px 10px;border-radius:8px;background:var(--surface2)}
.stat b{display:block;font:700 19px/1.1 var(--num)}
.stat span{font-size:12.5px;color:var(--muted)}
.two{display:grid;gap:0 18px}
@media (min-width:820px){.two{grid-template-columns:1fr 1fr}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.cols>.card{margin:12px 0}}

/* gráficos e tabelas */
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:11px var(--font)}
svg.ch .sel{fill:var(--ink);font-weight:600}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .meta{stroke:var(--ink);stroke-width:2}
svg.ch .hit{fill:transparent;cursor:pointer}
.tscroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
tbody tr td{border-top:1px solid var(--line)}
.heat td.c{padding:0;text-align:center}
.heat button{width:100%;min-width:38px;height:34px;border:0;border-radius:3px;font:600 13px var(--num);background:var(--surface2);color:var(--ink)}
.heat .ok{background:var(--okbg)}.heat .warn{background:var(--warnbg)}.heat .bad{background:var(--badbg)}
.heat button.cur{outline:2px solid var(--ink);outline-offset:-2px}
.heat td{padding:3px 2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* segurança */
.rk{display:grid;grid-template-columns:26px 1fr 58px 58px 44px;gap:0 4px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rk.h{border-top:0;padding:2px 0;font-size:12.5px;color:var(--muted);font-weight:600}
.rk .pos{font:700 18px/1 var(--num)}
.rk .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n{text-align:right;font:600 16px var(--num)}
.rk .tot{font-weight:700}
.rk .bar{grid-column:2/6;display:flex;height:6px;margin-top:5px;border-radius:2px;overflow:hidden;background:var(--surface2)}
.rk .bar i{display:block;height:100%}
.b-rel{background:var(--ink)}.b-rec{background:var(--hi)}
.rk.zero .nm,.rk.zero .n{color:var(--muted)}
.dss{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.dss:first-of-type{border-top:0}
.dss .dt{text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--surface2)}
.dss .dt b{display:block;font:700 22px/1 var(--num)}
.dss .dt span{font-size:12px;color:var(--muted)}
.dss.today .dt{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dss.today .dt span{color:inherit}
.dss .tema{font-weight:600}
.dss.none .tema{font-weight:400;color:var(--muted)}
.ls{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ls:first-of-type{border-top:0}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.reg{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.reg .m{font-size:12.5px;color:var(--muted)}

/* corretiva */
.big{font:700 44px/1 var(--num)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmp .stat b{font-size:24px}
.segbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);margin:8px 0}
.segbar i{display:block;height:100%}
.c-aut{background:var(--ib)}.c-ins{background:var(--ic)}.c-red{background:#6D5BB5}.c-na{background:var(--line)}
:root[data-theme="dark"] .c-red{background:#9C8CE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-red{background:#9C8CE0}}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.lg span i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ev{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:10px}
.ev .dt{text-align:center}
.ev .dt b{display:block;font:700 20px/1 var(--num)}
.ev .dt span{font-size:12px;color:var(--muted)}
.ev .tg{font-weight:600}
.ev .ob{margin:2px 0 4px}
.ev .mt{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.ev select{margin-top:8px;min-height:40px;max-width:230px}
.top5{display:flex;gap:8px;flex-wrap:wrap}
.top5 .stat{min-width:84px;flex:1}

/* conquistas e equipe */
.mh{font:600 17px/1.2 var(--num);margin:18px 0 6px}
.conq{padding:12px;border:1px solid var(--line);border-left:6px solid var(--ic);border-radius:8px;margin:8px 0;background:var(--surface)}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.who span{padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500}
.mem{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}
.mem h3{margin:0 0 6px;font:600 17px/1.2 var(--num)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:3px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.neg{color:var(--bad)}.posv{color:var(--ok)}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.chk label{display:flex;align-items:center;gap:8px;min-height:36px}
.chk input{width:20px;height:20px}
.chk3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px}
.chk3 label{display:block}
.chk3 span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.chk3 input{width:100%;min-height:34px;padding:4px 6px}
.vac{padding:4px 0}
.vacrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;padding:5px 0}
.vacname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vactrack{position:relative;height:16px;background:var(--surface2);border-radius:3px}
.vacbar{position:absolute;top:1px;bottom:1px;border-radius:3px;background:var(--ok)}
.vacbar.over{background:var(--bad)}
.vacnone{color:var(--muted);font-size:12.5px}
.ot-row{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.ot-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ot-track{position:relative;height:14px;background:var(--surface2);border-radius:3px}
.ot-fill{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--ok)}
.ot-fill.over{background:var(--bad)}
.ot-lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.ot-val{text-align:right;font:600 13px var(--num)}
.ot-val.over{color:var(--bad)}
.cards{display:grid;gap:0 14px}
@media (min-width:820px){.cards{grid-template-columns:1fr 1fr}}

/* barra de salvar, toast e janela */
.savebar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--surface);max-width:620px;margin:0 auto}
.savebar span{flex:1;font-weight:500}
.savebar .btn{background:var(--hi);border-color:var(--hi);color:#14202B}
.savebar .btn.ghost{background:transparent;border-color:#8a96a3;color:var(--surface)}
@media (min-width:820px){.savebar{bottom:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(126px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,520px);padding:10px 14px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:420px;background:var(--surface);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:820px){.ov{align-items:center}.sheet{border-radius:14px}}
.err{color:var(--bad);font-size:13.5px;margin:0 0 8px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
window.startApp=function(D,S0,api){
'use strict';
/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const M3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const dm=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);
const pd=iso=>{const p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((pd(isoOf(b))-pd(isoOf(a)))/86400000);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const short=n=>{const p=n.split(' ');return p.length>1?p[0]+' '+p[p.length-1]:n};
const shortI=n=>{const p=n.split(' ');return p.length>1?p[0]+' '+p[p.length-1][0]+'.':n};
const fU=(v,u)=>v==null?'—':(u==='%'?nf1.format(v)+'%':u==='t/h'?nf0.format(v)+' t/h':u==='t'?nf0.format(v)+' t':nf1.format(v));
const fmtH=h=>h==null?'—':nf0.format(h)+' h';
const fmtMin=m=>m>=60?(Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'')):m+' min';
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const ICON={
  ind:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',

function sha256hex(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const h=Uint32Array.from([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const b=new TextEncoder().encode(msg),l=b.length,nb=((l+9+63)>>6)<<6,buf=new Uint8Array(nb);
  buf.set(b);buf[l]=0x80;const dv=new DataView(buf.buffer);
  dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  const w=new Uint32Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))>>>0}
    let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let i=0;i<64;i++){
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0;
    }
    h[0]+=a;h[1]+=b2;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh;
  }
  return Array.from(h).map(x=>x.toString(16).padStart(8,'0')).join('');
}

/* ---------- gráfico genérico de barras com linha de limite ---------- */
function limitChart(labels,vals,limit,fmt,selIdx){
  const W=360,H=Math.max(140,labels.length*26+40),L=108,R=40,T=10,B=10,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(limit*1.2,...vals.map(v=>v||0),1),x=v=>L+(v/mx)*iw;
  const rh=ih/labels.length,bh=rh*0.56;
  let s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valores por pessoa com limite de '+fmt(limit)+'">';
  labels.forEach((lb,i)=>{
    const v=vals[i]||0,y=T+i*rh+(rh-bh)/2,over=v>limit,sel=i===selIdx;
    s+='<text x="'+(L-8)+'" y="'+(y+bh/2+3.5).toFixed(1)+'" text-anchor="end" style="font-size:10.5px" class="'+(sel?'sel':'')+'">'+E(shortI(lb))+'</text>';
    s+='<rect x="'+L+'" y="'+y.toFixed(1)+'" width="'+Math.max(2,x(v)-L).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(over?'var(--bad)':'var(--ok)')+'" opacity="'+(sel?1:0.85)+'"/>';
    s+='<text x="'+(x(v)+5).toFixed(1)+'" y="'+(y+bh/2+3.5).toFixed(1)+'" class="'+(over?'sel':'')+'">'+fmt(v)+'</text>';
  });
  const lx=x(limit);
  s+='<line x1="'+lx.toFixed(1)+'" x2="'+lx.toFixed(1)+'" y1="'+T+'" y2="'+(T+ih)+'" class="meta"/>';
  return s+'</svg>';
}

/* ---------- sobreposição de férias ---------- */
function doyRange(iso1,iso2){const a=pd(iso1),b=pd(iso2),y=a.getFullYear();const s0=new Date(y,0,1);return [Math.round((a-s0)/86400000),Math.round((b-s0)/86400000)]}
function feriasOverlaps(eq){
  const per=TEAMSAFE(eq).filter(x=>x.r).map(x=>({n:x.n,r:x.r,rg:doyRange(x.r[0],x.r[1])}));
  const over=new Set();
  for(let i=0;i<per.length;i++)for(let k=i+1;k<per.length;k++){
    const a=per[i].rg,b=per[k].rg;
    if(a[0]<=b[1]&&b[0]<=a[1]){over.add(per[i].n);over.add(per[k].n);}
  }
  return {per,over};
}
function TEAMSAFE(eq){return D.seg.equipe.map(n=>{const d=eq[n]||{};return {n,r:(d.fer1&&d.fer2)?[d.fer1,d.fer2]:null}})}

const PARTIAL=D.meta.fracMes<1;
const status=(real,meta)=>real==null||meta==null?'na':real>=meta?'ok':real>=meta*0.95?'warn':'bad';
const STW={ok:'Na meta',warn:'Perto da meta',bad:'Abaixo da meta',na:'Sem dado'};
function ytd(p,k,idx){let s=0;D.ind[p].meses.forEach(r=>{const v=r[k];if(!v)return;
  if(idx===0){if(r.m<CUR)s+=v[0]||0;else if(r.m===CUR)s+=(v[0]||0)*D.meta.fracMes}
  else if(r.tem)s+=v[1]||0});return s}
function monthRows(p,m){
  const r=D.ind[p].meses[m-1],out=[];
  KPIS[p].forEach(d=>{
    const v=r[d.k];let meta=v?v[0]:null,real=r.tem&&v?v[1]:null,extra='';
    if(d.prod&&v){
      extra='Orçado do mês: '+nf0.format(v[0])+' t';
      if(m===CUR&&PARTIAL){meta=v[0]*D.meta.fracMes;extra+='. Meta proporcional até '+dm(D.meta.dataAte)+': '+nf0.format(meta)+' t'}
    }
    out.push({d,real,meta,extra});
  });
  if(p==='icman'&&m===CUR&&D.ind.sumario.recup){const rc=D.ind.sumario.recup;out.push({d:{k:'recup',n:'Recuperação mássica magnética (2,00 mm)',u:'%'},real:rc.mes[1],meta:rc.mes[0],extra:''})}
  return out;
}
function yearRows(p){
  const a=D.ind[p].ano,out=[];
  KPIS[p].forEach(d=>{
    let meta=a[d.k]?a[d.k][0]:null,real=a[d.k]?a[d.k][1]:null,extra='';
    if(d.prod){const full=D.ind[p].meses.reduce((s,r)=>s+((r.prod&&r.prod[0])||0),0);meta=ytd(p,'prod',0);real=ytd(p,'prod',1);extra='Orçado do ano: '+nf0.format(full)+' t. Orçado até '+dm(D.meta.dataAte)+': '+nf0.format(meta)+' t'}
    out.push({d,real,meta,extra});
  });
  if(p==='icman'&&D.ind.sumario.recup){const rc=D.ind.sumario.recup;out.push({d:{k:'recup',n:'Recuperação mássica magnética (2,00 mm)',u:'%'},real:rc.ano[1],meta:rc.ano[0],extra:''})}
  return out;
}
const stList=rows=>rows.map(r=>status(r.real,r.meta));
const okCount=l=>l.filter(x=>x==='ok').length;
const measured=l=>l.filter(x=>x!=='na').length;
const pips=l=>'<div class="pips" aria-hidden="true">'+l.map(s=>'<span class="pip '+s+'"></span>').join('')+'</div>';

function kpiRow(o){
  const st=status(o.real,o.meta),u=o.d.u,pr=!!o.d.prod;
  const max=u==='%'?100:(Math.max(o.real||0,o.meta||0)*1.15||1);
  const w=o.real==null?0:Math.min(100,o.real/max*100),t=o.meta==null?null:Math.min(100,o.meta/max*100);
  let dl='';
  if(o.real!=null&&o.meta!=null){
    if(pr)dl=nf0.format(o.real/o.meta*100)+'% do orçado';
    else{const x=o.real-o.meta;dl=(x>=0?'+':'−')+(u==='%'?nf1.format(Math.abs(x))+' p.p.':nf0.format(Math.abs(x))+' '+u)}
  }
  return '<div class="kpi s-'+st+'"><div class="kpi-h"><span class="kpi-n">'+E(o.d.n)+'</span><span class="kpi-v">'+(o.real==null?'—':fU(o.real,u))+'</span></div>'
   +'<div class="bullet" role="img" aria-label="'+E(o.d.n)+': '+(o.real==null?'sem dado':fU(o.real,u))+', meta '+fU(o.meta,u)+'"><i class="fill" style="width:'+w.toFixed(1)+'%"></i>'+(t==null?'':'<b class="tick" style="left:'+t.toFixed(1)+'%"></b>')+'</div>'
   +'<div class="kpi-f"><span>'+(pr&&o.meta!=null?'Meta ':'Meta ')+fU(o.meta,u)+'</span><span class="d">'+(o.real==null?'sem dado':E(dl)+' ('+STW[st].toLowerCase()+')')+'</span></div>'
   +(o.extra?'<div class="kpi-x">'+E(o.extra)+'</div>':'')+'</div>';
}

/* gráfico de barras por mês (real) com marca da meta */
function trend(p,k,sel){
  const W=360,H=176,L=40,R=8,T=12,B=24,iw=W-L-R,ih=H-T-B,d=KPIS[p].find(x=>x.k===k),u=d.u;
  const rows=D.ind[p].meses,vals=rows.map(r=>r.tem&&r[k]?r[k][1]:null),metas=rows.map(r=>r[k]?r[k][0]:null);
  const mx0=Math.max(...vals.filter(v=>v!=null),...metas.filter(v=>v!=null),1);
  const max=u==='%'?100:mx0*1.12,sl=iw/12,bw=sl*0.56;
  const y=v=>T+ih-(v/max)*ih;
  const fm=v=>u==='t'?nf0.format(v/1000)+' mil':u==='%'?nf0.format(v)+'%':nf0.format(v);
  let s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+E(d.n)+' por mês em '+D.meta.ano+'">';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text x="'+(L-5)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+fm(v)+'</text>'}
  const col=PLANT[p].c;
  for(let i=0;i<12;i++){
    const x=L+i*sl+(sl-bw)/2,m=i+1,v=vals[i],isSel=m===sel;
    if(v!=null){const yy=y(v);s+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(T+ih-yy).toFixed(1)+'" rx="2" fill="'+col+'" opacity="'+(isSel?1:0.55)+'"/>'}
    if(metas[i]!=null){const yy=y(metas[i]);s+='<line class="meta" x1="'+(x-3).toFixed(1)+'" x2="'+(x+bw+3).toFixed(1)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" opacity="'+(v==null?0.3:1)+'"/>'}
    s+='<text class="'+(isSel?'sel':'')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+M3[i].charAt(0).toUpperCase()+'</text>';
    if(isSel&&v!=null){s+='<text class="sel" x="'+(x+bw/2).toFixed(1)+'" y="'+Math.max(9,y(v)-4).toFixed(1)+'" text-anchor="middle">'+fm(v)+'</text>'}
    s+='<rect class="hit" data-act="pickmes" data-m="'+m+'" x="'+(L+i*sl).toFixed(1)+'" y="0" width="'+sl.toFixed(1)+'" height="'+H+'"><title>'+MES[i]+'</title></rect>';
  }
  return s+'</svg>';
}

  const flMin=fl.reduce((s,e)=>s+e.min,0);
  h+='<section class="card"><div class="hd"><div><h2>Lista de falhas</h2><div class="small muted">'+fl.length+' de '+tot+' falhas'+(U.corMes||U.corCls!=='all'?', neste filtro':'')+'</div></div></div>'
   +'<div class="chips" role="group" aria-label="Mês"><button class="chip" data-act="cormes" data-m="0" aria-pressed="'+(U.corMes===0)+'">Ano</button>'+M3.slice(0,CUR).map((n,i)=>'<button class="chip" data-act="cormes" data-m="'+(i+1)+'" aria-pressed="'+(U.corMes===i+1)+'">'+n+'</button>').join('')+'</div>'
   +'<div class="chips" role="group" aria-label="Disciplina">'+[['all','Todas'],['aut','Automação'],['ins','Instrumentação'],['red','Redes'],['na','A classificar']].map(c=>'<button class="chip" data-act="corcls" data-v="'+c[0]+'" aria-pressed="'+(U.corCls===c[0])+'">'+c[1]+'</button>').join('')+'</div>'
   +(U.corMes||U.corCls!=='all'?'<div class="stats" style="margin:10px 0"><div class="stat"><b>'+fl.length+'</b><span>falhas no filtro</span></div><div class="stat"><b>'+fmtMin(Math.round(flMin))+'</b><span>tempo total parado</span></div><div class="stat"><b>'+(fl.length?fmtMin(Math.round(flMin/fl.length)):'—')+'</b><span>duração média</span></div></div>':'');
  if(!fl.length)h+='<div class="empty">Nenhuma falha neste filtro.</div>';
  fl.slice(0,U.corLim).forEach(e=>{
    const c=clsOf(e),dt=pd(e.d);
    h+='<article class="ev"><div class="dt"><b>'+e.d.slice(8,10)+'</b><span>'+M3[dt.getMonth()]+'</span></div><div><div class="tg">'+E(e.tag||e.ar)+' <span class="badge">'+E(e.pl)+'</span></div><div class="ob">'+E(e.obs||'Sem observação')+'</div>'
     +'<div class="mt"><span>'+(e.i||'')+' às '+(e.f||'')+'</span><span>'+fmtMin(e.min)+'</span><span>'+E(e.ar)+'</span><span>'+E(e.src)+'</span></div>';
    if(U.logged)h+='<select data-chg="cls" data-id="'+e.id+'" aria-label="Disciplina da falha"><option value="na"'+(c==='na'?' selected':'')+'>A classificar</option>'+['aut','ins','red'].map(k=>'<option value="'+k+'"'+(c===k?' selected':'')+'>'+CLS[k]+'</option>').join('')+'</select>';
    else h+='<div style="margin-top:6px"><span class="badge">'+(c==='na'?'A classificar':CLS[c])+'</span></div>';
    h+='</div></article>';
  });
  if(fl.length>U.corLim)h+='<div class="btns" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-act="cormore">Mostrar mais</button></div>';
  h+='<div class="note">Quando uma parada aparece em várias linhas da planilha (hematita, itabirito e ICMAN), ela conta como uma falha só. Paradas com mesma data e horário em duas abas também foram unidas.</div></section>';

  if(U.logged){
    h+='<section class="card"><div class="admin" style="margin-top:0"><h3>Histórico de '+ant.ano+' (manual)</h3><div class="small muted" style="margin-bottom:8px">Informe a quantidade de falhas e, se tiver, as horas em falha de cada mês. Deixe em branco o que não tiver.</div><form data-form="ant"><div class="tscroll"><table><thead><tr><th style="text-align:left">Mês</th><th>Falhas</th><th>Horas</th></tr></thead><tbody>'
     +M3.map((n,i)=>'<tr><td style="text-align:left">'+n+'</td><td><input type="number" min="0" inputmode="numeric" name="m'+i+'" value="'+(aM[i]==null?'':E(aM[i]))+'"></td><td><input type="number" min="0" step="0.1" inputmode="decimal" name="h'+i+'" value="'+(aH[i]==null?'':E(aH[i]))+'"></td></tr>').join('')
     +'</tbody></table></div><div class="btns"><button class="btn" type="submit">Guardar histórico</button></div></form></div></section>';
  }
  return h;
}

/* ---------- aba 4: Conquistas ---------- */
function tabCon(){
  let h='';
  const ed=U.edit.con?S.conquistas.find(x=>x.id===U.edit.con):null;
  const grp={};S.conquistas.forEach(c=>{(grp[c.mes]=grp[c.mes]||[]).push(c)});
  const ks=Object.keys(grp).sort().reverse();
  h+='<section class="card"><div class="hd"><div><h2>Conquistas da equipe de Automação</h2><div class="small muted">'+S.conquistas.length+' registradas</div></div></div>';
  if(!ks.length)h+='<div class="empty">Nenhuma conquista cadastrada ainda.'+(U.logged?'':' O supervisor cadastra aqui.')+'</div>';
  ks.forEach(k=>{
    h+='<div class="mh">'+MES[+k.slice(5,7)-1]+' de '+k.slice(0,4)+'</div>';
    grp[k].forEach(c=>{
      h+='<div class="conq"><div>'+E(c.desc).replace(/\n/g,'<br>')+'</div><div class="who">'+c.resp.map(n=>'<span>'+E(n)+'</span>').join('')+'</div>'
       +(U.logged?'<div class="btns" style="margin-top:8px"><button class="btn ghost sm" data-act="conedit" data-id="'+c.id+'">Editar</button><button class="btn danger sm" data-act="condel" data-id="'+c.id+'">Excluir</button></div>':'')+'</div>';
    });
  });
  h+='</section>';
  if(U.logged){
    const sel=ed?ed.resp:[],extra=sel.filter(n=>!TEAM.includes(n)).join(', ');
    h+='<section class="card"><div class="admin" style="margin-top:0"><h3>'+(ed?'Editar conquista':'Cadastrar conquista')+'</h3><form data-form="con"><label class="f"><span>Mês</span><input type="month" name="mes" required value="'+E(ed?ed.mes:isoOf(TODAY).slice(0,7))+'"></label>'
     +'<div class="f"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">Responsáveis (até 5)</span><div class="chk">'+TEAM.map(n=>'<label><input type="checkbox" name="resp" value="'+E(n)+'"'+(sel.includes(n)?' checked':'')+'>'+E(short(n))+'</label>').join('')+'</div></div>'
     +'<label class="f"><span>Outro responsável (opcional)</span><input type="text" name="extra" value="'+E(extra)+'" placeholder="Nome de quem não está na lista"></label>'
     +'<label class="f"><span>Descrição</span><textarea name="desc" required maxlength="600">'+E(ed?ed.desc:'')+'</textarea></label>'
     +'<div class="btns"><button class="btn" type="submit">'+(ed?'Atualizar conquista':'Adicionar conquista')+'</button>'+(ed?'<button class="btn ghost" type="button" data-act="concancel">Cancelar</button>':'')+'</div></form></div></section>';
  }
  return h;
}

/* ---------- aba 5: Dados da Equipe ---------- */
const DISC=['Automação','Instrumentação','Redes'];
function nextBday(iso){if(!iso)return null;const b=pd(iso);let n=new Date(TODAY.getFullYear(),b.getMonth(),b.getDate());if(dayDiff(TODAY,n)<0)n=new Date(TODAY.getFullYear()+1,b.getMonth(),b.getDate());return dayDiff(TODAY,n)}
function tabEq(){
  const eq=S.equipe;let h='';
  const bd=TEAM.filter(n=>eq[n]&&eq[n].nasc&&+eq[n].nasc.slice(5,7)===TODAY.getMonth()+1).sort((a,b)=>eq[a].nasc.slice(8).localeCompare(eq[b].nasc.slice(8)));
  const fer=TEAM.filter(n=>eq[n]&&eq[n].fer1&&eq[n].fer2&&eq[n].fer2>=isoOf(TODAY)).sort((a,b)=>eq[a].fer1.localeCompare(eq[b].fer1));
  if(bd.length||fer.length){
    h+='<section class="card"><h2>Em destaque</h2>';
    if(bd.length)h+='<h3>Aniversariantes de '+MES[TODAY.getMonth()].toLowerCase()+'</h3>'+bd.map(n=>'<div class="ls"><span>'+E(short(n))+'</span><b>'+dm(eq[n].nasc)+'</b></div>').join('');
    if(fer.length)h+='<h3>Férias em andamento ou próximas</h3>'+fer.slice(0,6).map(n=>'<div class="ls"><span>'+E(short(n))+'</span><b>'+dm(eq[n].fer1)+' a '+dm(eq[n].fer2)+'</b></div>').join('');
    h+='</section>';
  }

  /* sobreposição de férias */
  const {per,over}=feriasOverlaps(eq),yy=TODAY.getFullYear(),y0=new Date(yy,0,1);
  h+='<section class="card"><div class="hd"><div><h2>Férias da equipe</h2><div class="small muted">Períodos cadastrados em '+yy+', por pessoa</div></div></div>';
  if(!per.length)h+='<div class="empty">Nenhum período de férias cadastrado ainda.</div>';
  else{
    h+='<div class="vac">'+TEAM.map(n=>{
      const r=per.find(x=>x.n===n);
      if(!r)return '<div class="vacrow"><span class="vacname">'+E(short(n))+'</span><span class="vacnone">sem férias cadastradas</span></div>';
      const isOver=over.has(n),l=Math.max(0,r.rg[0]/365*100),w=Math.max(0.8,(r.rg[1]-r.rg[0])/365*100);
      return '<div class="vacrow"><span class="vacname" title="'+E(n)+'">'+E(short(n))+(isOver?' ⚠':'')+'</span><div class="vactrack" role="img" aria-label="Férias de '+E(short(n))+': '+dmy(r.r[0])+' a '+dmy(r.r[1])+(isOver?', com sobreposição':'')+'"><div class="vacbar'+(isOver?' over':'')+'" style="left:'+l.toFixed(1)+'%;width:'+w.toFixed(1)+'%"></div></div></div>';
    }).join('')+'</div>';
    h+='<div class="legend"><span><i style="background:var(--ok)"></i>Sem sobreposição</span><span><i style="background:var(--bad)"></i>Sobrepõe com outra pessoa</span></div>';
    h+=over.size?'<div class="note">Em sobreposição: '+[...over].map(short).join(', ')+'.</div>':'<div class="note">Nenhuma sobreposição entre os períodos cadastrados.</div>';
  }
  h+='</section>';

  /* horas extras */
  const hm=U.heMes,HE=TEAM.map(n=>+(((eq[n]||{}).he||{})[hm])||0),heMax=16;
  const sobre=TEAM.filter((n,i)=>HE[i]>heMax);
  h+='<section class="card"><div class="hd"><div><h2>Horas extras</h2><div class="small muted">Meta: até '+heMax+' h por pessoa no mês</div></div></div>'
   +'<div class="chips" role="group" aria-label="Mês">'+M3.map((n,i)=>'<button class="chip" data-act="heMes" data-m="'+(i+1)+'" aria-pressed="'+(hm===i+1)+'">'+n+'</button>').join('')+'</div>'
   +limitChart(TEAM,HE,heMax,v=>nf1.format(v)+'h')
   +'<div class="legend"><span><i style="background:var(--ok)"></i>Até '+heMax+' h</span><span><i style="background:var(--bad)"></i>Acima de '+heMax+' h</span><span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>Meta ('+heMax+' h)</span></div>'
   +(sobre.length?'<div class="note">Acima da meta em '+MES[hm-1].toLowerCase()+': '+sobre.map(short).join(', ')+'.</div>':'<div class="small muted" style="margin-top:8px">Ninguém acima da meta em '+MES[hm-1].toLowerCase()+'.</div>')
   +'</section>';

  h+='<div class="cards">';
  TEAM.forEach(n=>{
    const d=eq[n]||{},editing=U.logged&&U.edit.eq===n;
    h+='<article class="mem"><h3>'+E(n)+'</h3>';
    if(editing){
      h+='<form data-form="eq" data-n="'+E(n)+'"><div class="row2"><label class="f"><span>PN</span><input type="text" name="pn" value="'+E(d.pn||'')+'"></label><label class="f"><span>Disciplina</span><select name="disc"><option value=""></option>'+DISC.map(x=>'<option'+(d.disc===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label></div>'
       +'<div class="row2"><label class="f"><span>Data de aniversário</span><input type="date" name="nasc" value="'+E(d.nasc||'')+'"></label><label class="f"><span>Tempo de casa</span><input type="text" name="casa" placeholder="ex.: 6 anos e 3 meses" value="'+E(d.casa||'')+'"></label></div>'
       +'<div class="row2"><label class="f"><span>Férias, início</span><input type="date" name="fer1" value="'+E(d.fer1||'')+'"></label><label class="f"><span>Férias, fim</span><input type="date" name="fer2" value="'+E(d.fer2||'')+'"></label></div>'
       +'<label class="f"><span>Banco de horas</span><input type="text" name="bh" placeholder="ex.: +12:30 ou -08:00" value="'+E(d.bh||'')+'"></label>'
       +'<div class="f"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">Horas extras por mês (meta: até 16 h)</span><div class="chk3">'+M3.map((mn,i)=>'<label><span>'+mn+'</span><input type="number" min="0" step="0.5" inputmode="decimal" name="he'+(i+1)+'" value="'+(((d.he||{})[i+1]!=null)?E(d.he[i+1]):'')+'"></label>').join('')+'</div></div>'
       +'<div class="btns"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-act="eqcancel">Cancelar</button></div></form>';
    }else{
      const nb=nextBday(d.nasc),bh=(d.bh||'').trim();
      let fe='—';if(d.fer1&&d.fer2){const t=isoOf(TODAY);fe=dmy(d.fer1)+' a '+dmy(d.fer2)+(d.fer1<=t&&t<=d.fer2?' (em férias)':d.fer1>t?' (começa em '+dayDiff(TODAY,pd(d.fer1))+' dias)':'')}
      const heC=(d.he||{})[CUR];
      h+='<dl class="kv"><dt>PN</dt><dd>'+E(d.pn||'—')+'</dd><dt>Disciplina</dt><dd>'+E(d.disc||'—')+'</dd><dt>Aniversário</dt><dd>'+(d.nasc?dmy(d.nasc)+(nb===0?' (hoje)':nb<=30?' (em '+nb+' dias)':''):'—')+'</dd><dt>Tempo de casa</dt><dd>'+E(d.casa||'—')+'</dd><dt>Período de férias</dt><dd>'+fe+'</dd><dt>Banco de horas</dt><dd class="'+(bh.startsWith('-')?'neg':bh.startsWith('+')?'posv':'')+'">'+E(bh||'—')+'</dd><dt>Horas extras, '+M3[CUR-1]+'</dt><dd class="'+(heC>16?'neg':'')+'">'+(heC!=null?nf1.format(heC)+' h':'—')+'</dd></dl>';
      if(U.logged)h+='<div class="btns" style="margin-top:8px"><button class="btn ghost sm" data-act="eqedit" data-n="'+E(n)+'">Editar</button></div>';
    }
    h+='</article>';
  });
  h+='</div>';
  if(!U.logged&&!Object.keys(eq).length)h+='<div class="note">Os dados da equipe ainda não foram preenchidos. O supervisor preenche depois de entrar.</div>';
  return h;
}

/* ---------- montagem da tela ---------- */
const TABS=[['ind','Indicadores'],['seg','Segurança'],['cor','Corretiva'],['con','Conquistas'],['eq','Equipe']];
function render(keepScroll){
  const y=window.scrollY;
  let body='';
  try{body=U.tab==='ind'?tabInd():U.tab==='seg'?tabSeg():U.tab==='cor'?tabCor():U.tab==='con'?tabCon():tabEq()}
  catch(err){body='<div class="card"><h2>Erro ao montar a aba</h2><p class="muted">'+E(err&&err.message)+'</p></div>'}
  const app=$('#app');
  app.innerHTML='<header class="top"><div class="wrap top-in"><div class="grow"><h1>Indicadores da Automação</h1><div class="sub">Mina do Andrade. Dados das planilhas até '+dmy(D.meta.dataAte)+'</div></div>'
   +(U.logged?'<span class="pill">Modo edição</span>':'')+'<button class="iconbtn" data-act="logout">Sair</button>'+'</div>'+(U.logged?'<div class="stripe"></div>':'')+'</header>'
   +'<nav class="nav" role="tablist" aria-label="Abas">'+TABS.map(t=>'<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(U.tab===t[0])+'">'+svgI(t[0]==='ind'?'ind':t[0]==='seg'?'seg':t[0]==='cor'?'cor':t[0]==='con'?'con':'eq')+'<span>'+t[1]+'</span></button>').join('')+'</nav>'
   +'<main class="wrap">'+body+'</main>'
   +'';
  if(keepScroll)window.scrollTo(0,y);
}
let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3800)}
function closeOv(){$('#overlay').innerHTML=''}
function openLogin(){
  $('#overlay').innerHTML='<div class="ov" data-act="ovbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lt"><h2 id="lt" style="font:600 20px var(--num);margin-bottom:10px">Entrar para editar</h2><form data-form="login"><label class="f"><span>Usuário</span><input type="text" name="u" autocomplete="username" autocapitalize="none" required></label><label class="f"><span>Senha</span><input type="password" name="p" autocomplete="current-password" required></label><div class="err" id="lerr" role="alert"></div><div class="btns"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="closeov">Cancelar</button></div></form></div></div>';
  const i=$('#overlay input');if(i)i.focus();
}

/* ---------- ações ---------- */
const A={
  tab(t){U.tab=t.dataset.v;persistUI();render();window.scrollTo(0,0)},
  plant(t){U.plant=t.dataset.v;persistUI();render(true)},
  mes(t){U.mes=+t.dataset.m;persistUI();render(true)},
  pickmes(t){const m=+t.dataset.m;if(D.ind[U.plant].meses[m-1].tem){U.mes=m;persistUI();render(true)}},
  segmes(t){U.segMes=+t.dataset.m;persistUI();render(true)},
  cormes(t){U.corMes=+t.dataset.m;U.corLim=25;persistUI();render(true)},
  corcls(t){U.corCls=t.dataset.v;U.corLim=25;persistUI();render(true)},
  cormetric(t){U.corMetric=t.dataset.v;persistUI();render(true)},
  cormore(){U.corLim+=25;render(true)},
  heMes(t){U.heMes=+t.dataset.m;persistUI();render(true)},
  login(){openLogin()},
  closeov(){closeOv()},
  ovbg(t,e){if(e.target===t)closeOv()},
  logout(){api.signOut()},
    dssedit(t){U.edit.dss=t.dataset.id;render(true)},
  dsscancel(){U.edit.dss=null;render(true)},
  dssdel(t){if(!confirm('Excluir este DSS?'))return;S.dss=S.dss.filter(x=>x.id!==t.dataset.id);U.edit.dss=null;touch();render(true)},
  conedit(t){U.edit.con=t.dataset.id;render(true);window.scrollTo(0,document.body.scrollHeight)},
  concancel(){U.edit.con=null;render(true)},
  condel(t){if(!confirm('Excluir esta conquista?'))return;S.conquistas=S.conquistas.filter(x=>x.id!==t.dataset.id);U.edit.con=null;touch();render(true)},
  eqedit(t){U.edit.eq=t.dataset.n;render(true)},
  eqcancel(){U.edit.eq=null;render(true)}
};
const F={
  login(f){
    const u=f.u.value.trim().toLowerCase(),p=f.p.value;
    if(sha256hex(u+':'+p)===D.meta.auth){U.logged=true;persistUI();closeOv();render(true);toast('Modo edição ativado')}
    else{$('#lerr').textContent='Usuário ou senha incorretos.'}
  },
  dss(f){
    const date=f.date.value,tema=f.tema.value.trim(),resp=f.resp.value.trim();
    if(!date||!tema)return;
    if(U.edit.dss){const x=S.dss.find(y=>y.id===U.edit.dss);if(x){x.date=date;x.tema=tema;x.resp=resp}}
    else S.dss.push({id:uid(),date,tema,resp});
    U.edit.dss=null;touch();render(true);toast('DSS incluído.');
  },
  con(f){
    const sel=Array.from(f.querySelectorAll('input[name=resp]:checked')).map(x=>x.value);
    const ex=f.extra.value.split(',').map(x=>x.trim()).filter(Boolean),resp=sel.concat(ex);
    if(!resp.length){toast('Escolha ao menos um responsável.');return}
    if(resp.length>5){toast('Use no máximo 5 responsáveis.');return}
    const o={mes:f.mes.value,desc:f.desc.value.trim(),resp};
    if(!o.mes||!o.desc)return;
    if(U.edit.con){const x=S.conquistas.find(y=>y.id===U.edit.con);if(x)Object.assign(x,o)}else S.conquistas.push(Object.assign({id:uid()},o));
    U.edit.con=null;touch();render(true);toast('Conquista incluída.');
  },
  eq(f){
    const n=f.dataset.n,he={};
    M3.forEach((_,i)=>{const v=f['he'+(i+1)].value;if(v!=='')he[i+1]=Math.max(0,parseFloat(v)||0)});
    S.equipe[n]={pn:f.pn.value.trim(),disc:f.disc.value,nasc:f.nasc.value,casa:f.casa.value.trim(),fer1:f.fer1.value,fer2:f.fer2.value,bh:f.bh.value.trim(),he};
    U.edit.eq=null;touch();render(true);toast('Dados atualizados.');
  },
  ant(f){
    S.cor.anterior.meses=M3.map((_,i)=>{const v=f['m'+i].value;return v===''?null:Math.max(0,parseInt(v,10)||0)});
    S.cor.anterior.horas=M3.map((_,i)=>{const v=f['h'+i].value;return v===''?null:Math.max(0,parseFloat(v)||0)});
    touch();render(true);toast('Histórico guardado.');
  }
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t,e)});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  if(t.dataset.chg==='kpi'){U.kpi=t.value;persistUI();render(true)}
  else if(t.dataset.chg==='cls'){if(t.value==='na')delete S.cor.classes[t.dataset.id];else S.cor.classes[t.dataset.id]=t.value;touch();render(true)}
  else if(t.dataset.chg==='segnome'){U.segNome=t.value;persistUI();render(true)}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();F[f.dataset.form]&&F[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});

render();
return {
  setState(s){if(dirty)return;S=defaults(s);render(true)},
  setEditor(b){U.logged=!!b;if(!b)U.edit={};render(true)}
};
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== PREENCHA AQUI (Firebase, Configurações do projeto, Seus apps, Web) ====== */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
/* E-mails que podem editar (os mesmos que estão em firestore.rules) */
const EDITORES = ["seu-email@empresa.com"];
/* ================================================================================ */

const $ = (s) => document.querySelector(s);
const gate = $("#gate"), appEl = $("#app");
const app = initializeApp(FIREBASE_CONFIG), auth = getAuth(app), db = getFirestore(app);

function showGate(msg) {
  appEl.innerHTML = "";
  gate.innerHTML = '<div class="wrap" style="max-width:420px;padding-top:12vh"><h1 style="font:600 26px var(--num)">Nova Gestão</h1><p class="muted" style="margin:4px 0 16px">Indicadores da Automação, Mina do Andrade</p>'
    + '<form id="lf"><label class="f"><span>E-mail</span><input type="text" name="e" autocomplete="username" autocapitalize="none" required></label>'
    + '<label class="f"><span>Senha</span><input type="password" name="p" autocomplete="current-password" required></label>'
    + '<div class="err" id="le" role="alert">' + (msg || "") + '</div><button class="btn" type="submit">Entrar</button></form></div>';
  $("#lf").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try { await signInWithEmailAndPassword(auth, ev.target.e.value.trim(), ev.target.p.value); }
    catch (e) { $("#le").textContent = "E-mail ou senha incorretos."; }
  });
}
function showMsg(t) { gate.innerHTML = '<div class="wrap" style="padding-top:16vh;text-align:center"><p>' + t + '</p><button class="btn ghost" id="so" style="margin-top:12px">Sair</button></div>'; $("#so").onclick = () => signOut(auth); }

let unsubs = [], inst = null, dados = null, estado;
function tentar() {
  if (!dados || estado === undefined) return;
  const editor = EDITORES.map((x) => x.toLowerCase()).includes((auth.currentUser.email || "").toLowerCase());
  if (!inst) {
    gate.innerHTML = "";
    inst = window.startApp(dados, estado || {}, {
      saveState: (s) => setDoc(doc(db, "dados", "estado"), { json: JSON.stringify(s), atualizadoEm: new Date().toISOString() }),
      signOut: () => signOut(auth),
      isEditor: () => editor
    });
  } else { inst.setState(estado || {}); }
  inst.setEditor(editor);
}
onAuthStateChanged(auth, (user) => {
  unsubs.forEach((f) => f()); unsubs = []; inst = null; dados = null; estado = undefined;
  if (!user) { showGate(); return; }
  gate.innerHTML = '<div class="wrap" style="padding-top:16vh;text-align:center" class="muted">Carregando...</div>';
  const erro = (e) => showMsg(e && e.code === "permission-denied" ? "Sem permissão. Peça ao supervisor para liberar seu acesso." : "Não foi possível carregar os dados.");
  unsubs.push(onSnapshot(doc(db, "dados", "planilhas"), (s) => {
    if (!s.exists()) { showMsg("Os dados das planilhas ainda não foram enviados. Rode a carga inicial (pasta sync)."); return; }
    dados = JSON.parse(s.data().json); inst = null; tentar();
  }, erro));
  unsubs.push(onSnapshot(doc(db, "dados", "estado"), (s) => {
    if (s.metadata.hasPendingWrites) return;
    estado = s.exists() ? JSON.parse(s.data().json) : {}; tentar();
  }, erro));
});
</script>
</body>
</html>
