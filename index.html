<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indicadores Automação · Acesso</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Indicadores">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#25324b;--tx:#e8eef8;--mut:#8fa1bd;--acc:#ff7a1a;--bad:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.logo{font-size:44px;text-align:center}
h1{font-size:19px;text-align:center;margin:8px 0 2px}
p.s{text-align:center;color:var(--mut);font-size:13px;margin:0 0 22px}
label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 5px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:22px;background:var(--acc);border:0;color:#fff;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:12px;text-align:center}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="box">
  <div class="logo">⚙️</div>
  <h1>Indicadores da Automação</h1>
  <p class="s">Mina do Andrade · acesso restrito</p>
  <label for="u">Usuário</label>
  <input id="u" autocapitalize="none" autocomplete="username" spellcheck="false">
  <label for="p">Senha</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="b" onclick="entrar()">Entrar</button>
  <div class="err" id="e"></div>
</div>
<script>
/* ===== cole aqui o firebaseConfig do seu projeto (mesmo conteúdo do apps.html) ===== */
var FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "SEU-PROJETO.firebaseapp.com",
  databaseURL: "https://SEU-PROJETO-default-rtdb.firebaseio.com",
  projectId: "SEU-PROJETO",
  appId: "COLE_AQUI"
};
var EMAIL_DOMINIO = '@indicadores.app';

var erro = document.getElementById('e'), btn = document.getElementById('b');
function configOk() { return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'COLE_AQUI'; }
if (!configOk() || typeof firebase === 'undefined') {
  erro.textContent = typeof firebase === 'undefined' ? 'Sem conexão com o serviço de acesso.' : 'Firebase não configurado.';
  btn.disabled = true;
} else {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(function (u) { if (u) location.replace('apps.html'); });
}
function entrar() {
  var u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
  if (!u || !p) { erro.textContent = 'Informe usuário e senha.'; return; }
  var email = u.indexOf('@') >= 0 ? u : u + EMAIL_DOMINIO;
  btn.disabled = true; erro.textContent = '';
  firebase.auth().signInWithEmailAndPassword(email, p).then(function () { location.replace('apps.html'); }).catch(function (e) {
    btn.disabled = false;
    var c = e && e.code || '';
    erro.textContent = c === 'auth/network-request-failed' ? 'Sem conexão com a internet.' :
      c === 'auth/too-many-requests' ? 'Muitas tentativas. Aguarde alguns minutos.' : 'Usuário ou senha inválidos.';
  });
}
document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !btn.disabled) entrar(); });
</script>
</body>
</html>
